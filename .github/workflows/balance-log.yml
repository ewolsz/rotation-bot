name: Balance log

# Saves the paper account's daily balance and trades to the log folder after
# the close, so results can be read from the repository. Places no orders.
on:
  schedule:
    - cron: "40 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: balance-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx tzdata
      - name: Save balance and trades
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python bot/rotation_bot.py report --out log
      - name: Commit the log
        run: |
          git config user.name "balance-log"
          git config user.email "actions@users.noreply.github.com"
          git add log
          git diff --cached --quiet || git commit -m "Balance log $(date -u +%F)"
          git push
